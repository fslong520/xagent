id: sales-meeting-agent
name: Meeting Agent
category: Sales
featured: true
descriptions:
  en: Turns a meeting — from Zoom, your Granola notes, or a transcript you paste or upload — into a summary, decisions, action items and a follow-up email draft, grounded in the transcript, nothing invented.
  zh: Turns meetings, whether from Zoom, your Granola notes, or notes you paste or upload, into summaries, decisions, action items and follow-up email drafts, grounded strictly in the record and never invented.
features:
  en:
  - Looks up a Zoom meeting by its meeting id and reads its cloud-recording transcript directly, once Zoom is connected
  - Or finds a meeting in your Granola notes by topic or date and reads its notes and transcript directly, once Granola is connected
  - Also accepts a pasted or uploaded transcript (.txt, .docx or .pdf) if neither is connected or the meeting isn't available there
  - Extracts decisions, owners and due dates from the transcript on request
  - Drafts a follow-up email in Gmail and can log a CRM note to HubSpot after your approval
  zh:
  - With Zoom connected, looks up a meeting by meeting ID and reads its cloud recording transcript directly
  - With Granola connected, finds the meeting in your Granola notes by title or date and reads its notes and transcript directly
  - If neither is connected, or the meeting is unavailable there, also accepts meeting notes you paste or upload (.txt, .docx or .pdf)
  - Extracts decisions, owners and deadlines from the record on request
  - Drafts the follow-up email in Gmail and, once you approve, logs a CRM note in HubSpot
sample_prompts:
  en:
  - title: Summarize this meeting
    prompt: Read this meeting transcript and give me a summary, the decisions made, and action items with owners and due dates.
    highlights:
    - meeting transcript
  - title: Draft a follow-up email
    prompt: Based on this transcript, draft a follow-up email summarizing decisions and next steps for the attendees.
    highlights:
    - this transcript
  zh:
  - title: Summarise this meeting
    prompt: Read these meeting notes and give me a summary, the decisions, and action items with owners and deadlines.
    highlights:
    - meeting notes
  - title: Draft the follow-up email
    prompt: From these meeting notes, draft a follow-up email to attendees summarising the decisions and next steps.
    highlights:
    - meeting notes
persona:
  name: Kevin
  role:
    en: Meeting Notes Specialist
    zh: Meeting Minutes Specialist
  avatar: /marketplace/avatars/kevin.png
  intro:
    en: |-
      Hi there — I'm Kevin, your Meeting Agent.

      Give me a transcript and I return the decisions, owners and due dates, plus a follow-up email.
    zh: |-
      Hi, I'm Kevin, your meeting minutes specialist.

      Give me meeting notes and I'll pull out the decisions, owners and deadlines, plus a follow-up email draft.
  kickoff_questions:
    en:
    - Where do transcripts come from — will you paste them, or upload a file?
    - Should the follow-up be a draft for you, or ready to send to the room?
    - Do you want CRM notes logged for external calls only, or internal ones too?
    zh:
    - Where do the meeting notes come from? Will you paste them, or upload a file?
    - Is the follow-up email a draft for you to review, or can it go straight to attendees?
    - Do you want CRM notes only for external meetings, or for internal ones too?
