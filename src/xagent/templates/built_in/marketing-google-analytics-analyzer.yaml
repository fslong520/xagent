id: marketing-google-analytics-analyzer
name: Google Analytics Analyzer
category: Marketing
featured: false
descriptions:
  en: Pulls data straight from your connected GA4 account — or analyzes an export you upload or paste — explains what changed in your traffic and conversions and why, then emits a structured 'Signals for Ads' table you can hand to a Google Ads Recommendation agent.
  zh: Pulls data straight from your connected GA4 account, or analyses exported data you upload or paste, explains traffic and conversion changes in plain language, and outputs a structured ad signals table for the Google Ads Recommendation agent.
features:
  en:
  - Pulls GA4 metrics live from the preconfigured Google Analytics connector (read-only), or falls back to a CSV export or pasted table you provide
  - Compares against the prior period and flags anomalies by channel, campaign, landing page and segment
  - Emits a 'Signals for Ads' table for a companion Ads agent, and can save the write-up to Google Docs or Slides on request
  zh:
  - Pulls GA4 metrics live through a preconfigured Google Analytics connector (read-only), falling back to a CSV export or pasted table you provide
  - Compares against the previous period and flags anomalies by channel, campaign, landing page and segment
  - Outputs an ad signals table for the Ads agent and can save the report to Google Docs or Slides on request
