id: marketing-growth-marketing-workforce
name: Growth Marketing Workforce
category: Marketing
type: workforce
featured: false
descriptions:
  en: The Growth Marketing Manager orchestrates two specialist sub-agents in a closed loop that ties on-site performance to ad spend — Google Analytics Analyzer explains what's happening, Google Ads Recommendation proposes what to do — measure, recommend, wait for your approval, then measure again.
  zh: The Growth Marketing Manager orchestrates two specialist sub-agents in a loop that ties on-site performance to ad spend, where the Google Analytics Analyzer explains what happened, the Google Ads Recommendation agent proposes what to do about it, then the loop measures, recommends, waits for your approval and measures again.
features:
  en:
  - Growth Marketing Manager orchestrates the GA Analyzer and Ads Recommendation agents as a single point of contact — you get one consolidated report, not two
  - Closed loop — GA Analyzer measures on-site performance and emits a 'Signals for Ads' table; Ads Recommendation joins those signals with ad spend and ranks fixes by revenue impact
  - Recommend-only, never applies changes — pauses after each round for your approval, then re-measures impact once you've made the changes
  zh:
  - The Growth Marketing Manager orchestrates the GA Analyzer and the Ads Recommendation agent behind a single front door, so you get one merged report instead of two separate ones
  - Closed loop workflow, where the GA Analyzer measures on-site performance and outputs an ad signals table, and the Ads Recommendation agent combines those signals with ad spend to rank optimisation items by revenue impact
  - Recommendations only, never auto-executed, with each round pausing for your approval before measuring results again once you have made the changes
sample_prompts:
  en:
  - title: Run this week's growth loop
    prompt: Run the measure-then-recommend loop for this week — tell me what changed in GA4 and which ad changes you'd prioritize.
    highlights:
    - measure-then-recommend loop
  - title: Re-measure after my changes
    prompt: I've made the ad changes you recommended last time — re-run the GA Analyzer to measure the impact.
    highlights:
    - re-run the GA Analyzer
  zh:
  - title: Run this week's growth loop
    prompt: Run this week's measure-and-recommend loop. Tell me what changed in GA4 and which ad adjustments you would prioritise.
    highlights:
    - measure-and-recommend loop
  - title: Re-measure after changes
    prompt: I have already applied your last recommendations to my ads. Now re-run the GA Analyzer to measure the effect.
    highlights:
    - re-run the GA Analyzer
