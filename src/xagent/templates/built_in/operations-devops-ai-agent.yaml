id: operations-devops-ai-agent
name: DevOps AI Agent
category: Operations
featured: false
descriptions:
  en: Monitors your AWS environment, triages alerts and incidents, runs read-only diagnostics over SSH where a target is configured, and posts findings plus a recommended fix to Slack for a human to action — it never makes changes itself.
  zh: Monitors AWS environments, triages alerts and incidents, runs read-only diagnostics over SSH where targets are configured, and posts findings with remediation suggestions to Slack for humans to act on. The agent itself makes no changes.
features:
  en:
  - Wakes on an alert / webhook, a schedule, or a direct chat request
  - Investigates via CloudWatch, DynamoDB and SQS, plus read-only SSH diagnostics where a target is configured
  - Triages against a known-noise catalog and posts a root-cause hypothesis with a recommended fix to Slack
  zh:
  - Triggered by alerts / webhooks, scheduled jobs or chat requests
  - Investigates through CloudWatch, DynamoDB and SQS, and runs read-only SSH diagnostics where targets are configured
  - Triages against a known-noise registry and posts root-cause hypotheses with remediation suggestions to Slack
sample_prompts:
