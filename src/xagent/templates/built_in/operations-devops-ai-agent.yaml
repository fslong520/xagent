  - title: Triage this incident now
    prompt: Pull the CloudWatch metrics and logs for the last hour, run read-only diagnostics on the affected hosts, and post a root-cause hypothesis with a recommended fix and severity to Slack.
    highlights:
    - CloudWatch metrics and logs
  - title: Check SQS and DynamoDB health
    prompt: Check the SQS queues and DynamoDB tables for this service for anomalies against the known-noise catalog, and report anything that doesn't match a known benign pattern.
    highlights:
    - SQS queues and DynamoDB tables
  zh:
  - title: Investigate this incident now
    prompt: Pull the past hour of CloudWatch metrics and logs, run read-only diagnostics on the affected hosts, and post the root-cause hypothesis, remediation suggestions and severity to Slack.
    highlights:
    - CloudWatch metrics and logs
  - title: Check SQS and DynamoDB health
    prompt: Check this service's SQS queues and DynamoDB tables for anomalies against the known-noise registry, and report anything that does not match a known benign pattern.
    highlights:
    - SQS queues and DynamoDB tables
